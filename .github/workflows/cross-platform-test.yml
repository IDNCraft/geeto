name: Cross Platform Test

on:
  workflow_run:
    workflows: ["Quality Checks"]
    types: [completed]

permissions:
  actions: read

jobs:
  cross-platform-test:
    name: Smoke ${{ matrix.binary }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            binary: geeto-linux
          - os: ubuntu-24.04-arm
            binary: geeto-linux-arm64
          - os: windows-latest
            binary: geeto-windows.exe
          - os: macos-15-intel
            binary: geeto-mac
          - os: macos-latest
            binary: geeto-mac-arm64

    steps:
    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: geeto-binaries
        path: .
        github-token: ${{ secrets.GITHUB_TOKEN }}
        run-id: ${{ github.event.workflow_run.id }}

    - name: Make binary executable (Linux/macOS)
      if: runner.os != 'Windows'
      run: chmod +x "${{ matrix.binary }}"

    - name: Test Linux/macOS binary
      if: runner.os != 'Windows'
      run: ./${{ matrix.binary }} --help

    - name: Test Windows binary
      if: runner.os == 'Windows'
      run: .\${{ matrix.binary }} --help
